<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"><defs><linearGradient id="ai" x1="0" x2="1"><stop stop-color="var(--neon-green)"/><stop offset=".35" stop-color="var(--electric-blue)"/><stop offset=".7" stop-color="var(--cyber-purple)"/><stop offset="1" stop-color="var(--plasma-pink)"/></linearGradient><linearGradient id="neon" x1="0" x2="1"><stop stop-color="var(--neon-green)"/><stop offset=".5" stop-color="var(--laser-cyan)"/><stop offset="1" stop-color="var(--electric-blue)"/></linearGradient><clipPath id="round"><rect width="1280" height="740" rx="34"/></clipPath></defs><style>:root{--bg-primary:#030712;--bg-secondary:#0B1220;--bg-surface:#101827;--bg-card:#131D2B;--neon-green:#00FF9D;--electric-blue:#00D9FF;--cyber-purple:#7A5CFF;--plasma-pink:#FF3CAC;--laser-cyan:#4DFFFF;--energy-yellow:#FFD400;--warning-red:#FF4D6D;--text-primary:#F5F7FF;--text-secondary:#A5B4C8;--text-muted:#6E7D96;--border:#20334C;--border-glow:#00D9FF;--shadow-green:0 0 30px rgba(0,255,157,.35);--shadow-blue:0 0 30px rgba(0,217,255,.35);--shadow-purple:0 0 30px rgba(122,92,255,.35);--gradient-ai:linear-gradient(135deg,#00FF9D 0%,#00D9FF 35%,#7A5CFF 70%,#FF3CAC 100%);--gradient-neon:linear-gradient(90deg,#00FF9D,#4DFFFF,#00D9FF);} text{font-family:Consolas,Monaco,monospace;fill:var(--text-primary)} .muted{fill:var(--text-secondary)} .card{fill:var(--bg-card);stroke:var(--border-glow);stroke-width:2} .pulse{animation:p 3.5s infinite} @keyframes p{50%{opacity:.45;filter:drop-shadow(0 0 18px var(--laser-cyan))}} .pop{opacity:0;animation:pop .7s forwards} @keyframes pop{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(18px)}} .float{animation:f 9s infinite linear} @keyframes f{from{transform:translateY(60px);opacity:0}20%{opacity:1}to{transform:translateY(-760px);opacity:0}} .scan{animation:s 3.5s infinite linear} @keyframes s{from{transform:translateX(-1300px)}to{transform:translateX(1300px)}} .reveal{animation:r 2.8s 1 linear} @keyframes r{from{transform:translateY(-760px)}to{transform:translateY(760px)}}</style><g clip-path="url(#round)"><rect width="1280" height="740" fill="var(--text-primary)"/><circle cx="1000" cy="130" r="110" fill="var(--cyber-purple)" opacity=".18" class="pulse"/><circle cx="260" cy="650" r="140" fill="var(--cyber-purple)" opacity=".12" class="pulse"/><text x="45" y="58" fill="var(--neon-green)">user@dev:~$ cat README.md<tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/> █</tspan></text><text x="55" y="160" font-size="86" font-family="Brush Script MT,cursive" fill="url(#ai)" class="pop">Saksham<animate attributeName="opacity" values="0;1;1" keyTimes="0;.18;1" dur="8s" repeatCount="indefinite"/></text><text x="65" y="215" font-size="28" fill="var(--electric-blue)"><tspan>B.Tech CSE Student</tspan><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.28;.34;.9;1" dur="9s" repeatCount="indefinite"/></text><text x="65" y="215" font-size="28" fill="var(--laser-cyan)">IoT &amp; Embedded Tinkerer<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.34;.39;.61;.66" dur="9s" repeatCount="indefinite"/></text><text x="65" y="215" font-size="28" fill="var(--cyber-purple)">AI/ML Explorer<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.71;.93;1" dur="9s" repeatCount="indefinite"/></text><rect x="50" y="245" width="520" height="52" rx="16" class="card"/><text x="70" y="279" font-size="21">Dream → Code → Fail → Debug → Repeat<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.7;.73;.98;1" dur="12s" repeatCount="indefinite"/></text><text x="70" y="279" font-size="17" class="muted">404: Social life not found.<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.73;.76;.79" dur="12s" repeatCount="indefinite"/></text><text x="70" y="279" font-size="17" class="muted">AI won't replace me. I'll automate myself first.<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.79;.82;.85
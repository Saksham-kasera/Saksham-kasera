<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240"><style>:root{--bg-primary:#030712;--bg-secondary:#0B1220;--bg-surface:#101827;--bg-card:#131D2B;--neon-green:#00FF9D;--electric-blue:#00D9FF;--cyber-purple:#7A5CFF;--plasma-pink:#FF3CAC;--laser-cyan:#4DFFFF;--energy-yellow:#FFD400;--warning-red:#FF4D6D;--text-primary:#F5F7FF;--text-secondary:#A5B4C8;--text-muted:#6E7D96;--border:#20334C;--border-glow:#00D9FF;--shadow-green:0 0 30px rgba(0,255,157,.35);--shadow-blue:0 0 30px rgba(0,217,255,.35);--shadow-purple:0 0 30px rgba(122,92,255,.35);--gradient-ai:linear-gradient(135deg,#00FF9D 0%,#00D9FF 35%,#7A5CFF 70%,#FF3CAC 100%);--gradient-neon:linear-gradient(90deg,#00FF9D,#4DFFFF,#00D9FF);}text{font-family:Consolas,monospace;fill:var(--text-primary)}.c{fill:var(--bg-card);stroke:var(--border-glow)}@keyframes w{from{width:0}}</style><defs><linearGradient id="g"><stop stop-color="var(--neon-green)"/><stop offset=".5" stop-color="var(--electric-blue)"/><stop offset="1" stop-color="var(--cyber-purple)"/></linearGradient></defs><rect width="720" height="240" rx="24" fill="var(--bg-primary)"/><text x="30" y="45" font-size="26">LANGUAGE LOADOUT</text><rect x="30" y="70" width="660" height="130" rx="18" class="c"/><rect x="60" y="105" width="560" height="18" rx="9" fill="url(#g)"><animate attributeName="width" from="0" to="560" dur="2s" fill="freeze"/></rect><text x="60" y="155" fill="var(--text-secondary)">Python • HTML • Arduino • ESP32 • AI • Web Dev</text><text x="60" y="185" fill="var(--energy-yellow)">Achievements loading locally...</text></svg>
